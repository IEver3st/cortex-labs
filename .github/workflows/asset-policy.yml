name: Asset policy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  forbidden-assets:
    name: Reject GTA binary assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Reject tracked YDD and YTD files
        shell: bash
        run: |
          mapfile -t forbidden < <(git ls-files | grep -Ei '\.(ydd|ytd)$' || true)
          if (( ${#forbidden[@]} > 0 )); then
            printf 'Forbidden GTA binary assets are tracked:\n'
            printf ' - %s\n' "${forbidden[@]}"
            exit 1
          fi
