name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    name: Build, sign, and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Validate release metadata
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release.mjs --check

      - name: Require updater signing secrets
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY)) {
            throw "Missing TAURI_SIGNING_PRIVATE_KEY GitHub Actions secret."
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PASSWORD)) {
            throw "Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD GitHub Actions secret."
          }

      - name: Run JavaScript tests
        run: bun run test

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust build cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Check Rust application
        run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Clean stale bundle artifacts
        shell: pwsh
        run: |
          $bundlePaths = @(
            "src-tauri/target/release/bundle",
            "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          )
          foreach ($bundlePath in $bundlePaths) {
            if (Test-Path -LiteralPath $bundlePath) {
              Remove-Item -LiteralPath $bundlePath -Recurse -Force
            }
          }

      - name: Build, sign, and upload release assets
        id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: ${{ steps.release.outputs.name }}
          releaseBody: ${{ steps.release.outputs.notes }}
          releaseCommitish: ${{ github.sha }}
          releaseDraft: ${{ steps.release.outputs.release_draft }}
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          retryAttempts: 2
          tauriScript: bun tauri
          args: --target x86_64-pc-windows-msvc

      - name: Verify uploaded release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $assets = @(gh release view $env:RELEASE_TAG --json assets --jq ".assets[].name")
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect release $env:RELEASE_TAG." }

          $required = @(
            @{ Label = "NSIS installer"; Pattern = "*-setup.exe" },
            @{ Label = "updater signature"; Pattern = "*.exe.sig" },
            @{ Label = "updater manifest"; Pattern = "latest.json" }
          )
          foreach ($item in $required) {
            if (-not ($assets | Where-Object { $_ -like $item.Pattern })) {
              throw "Release is missing $($item.Label) ($($item.Pattern)). Uploaded: $($assets -join ', ')"
            }
          }

      - name: Publish GitHub release
        if: steps.release.outputs.release_draft == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit $env:RELEASE_TAG --draft=false --latest
